name: 2A. Clean Grok

on:
  schedule:
    - cron: "0 5 * * *"  
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: clear-llm-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. PULL CODE
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install and Start Cloudflare WARP (TUN Global Mode)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          
          sudo systemctl start warp-svc
          sleep 2
          
          warp-cli --accept-tos registration new || warp-cli registration new
          
          warp-cli --accept-tos mode warp || warp-cli mode warp
          
          warp-cli --accept-tos connect || warp-cli connect
          sleep 5
          
          curl https://cloudflare.com/cdn-cgi/trace

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        run: |
          python -m playwright install chromium

      - name: Run bot
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python clear_grok.py

      - name: Upload Debug Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-screenshots
          path: error/error_screenshot.png
          if-no-files-found: ignore

      - name: Commit and push locator/config changes
        if: always()
        run: |
          if [ ! -d .git ]; then echo "Not a git checkout, skipping."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stages all locator txt files, changed_locators.json, and config.json
          git add locators/ json/config.json
          if git diff --cached --quiet; then
            echo "No locator/config changes to commit."
            exit 0
          fi
          git commit -m "chore: update locators/config from automation run"
          git pull --rebase --autostash || true
          git push