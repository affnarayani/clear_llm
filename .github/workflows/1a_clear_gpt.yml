name: 1A. Delete ChatGPT

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    # Ubuntu ki jagah MacOS use kiya kyunki iske IPs kam block hote hain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install and Start Cloudflare WARP (TUN Global Mode)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          
          sudo systemctl start warp-svc
          sleep 2
          
          warp-cli --accept-tos registration new || warp-cli registration new
          
          warp-cli --accept-tos mode warp || warp-cli mode warp
          
          warp-cli --accept-tos connect || warp-cli connect
          sleep 5
          
          curl https://cloudflare.com/cdn-cgi/trace

      # Mac par alag se xvfb install karne ki zaroorat nahi hoti
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium

      - name: Run Chat History Deletion Script
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          IMGBBB_API_KEY: ${{ secrets.IMGBBB_API_KEY }}
          PLAYWRIGHT_SCREENSHOT_ON_FAILURE: 'on'
        run: |
          python clear_gpt.py

      - name: Upload Debug Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-screenshots
          path: clear_gpt_error_screenshot.png
          if-no-files-found: ignore